name: Debug toolchain versions # run it more

on:
  push:
  workflow_dispatch:

jobs:
  debug-toolchain:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Debug toolchain versions
        run: |
          echo "=== Runner: ${{ matrix.os }} ==="
          echo "=== GCC versions ==="
          gcc --version
          ls -la /usr/bin/gcc* || true
          echo "=== Clang versions ==="
          clang --version
          ls -la /usr/bin/clang* || true
          echo "=== libstdc++ GLIBCXX versions ==="
          strings /usr/lib/*/libstdc++.so.6 | grep GLIBCXX | sort -V | tail -10
          echo "=== libstdc++ location ==="
          ldconfig -p | grep libstdc++
